services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres-pgvector
    environment:
      POSTGRES_DB: rag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgvector_data:
